<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Outfix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="max-width: 400px; margin: 100px auto; padding: 20px;">
        <h2>Set New Password</h2>
        <form id="resetForm">
            <div style="margin-bottom: 15px;">
                <label>New Password</label>
                <input type="password" id="newPassword" class="form-control" required minlength="6" style="width: 100%; padding: 10px;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">Update Password</button>
        </form>
        <p id="resetMessage" style="margin-top: 15px;"></p>
    </div>
    <script>
        const { createClient } = supabase;
        const db = createClient('atwcqongbgjkajjzeupt.supabase.co', 'sb_publishable_5s9tkMESDP4zKXxWitn3JA_41JQ90AE');
        
        db.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                console.log('User is in password recovery mode');
            }
        });
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const { error } = await db.auth.updateUser({ password: newPassword });
            const msgEl = document.getElementById('resetMessage');
            
            if (error) {
                msgEl.textContent = 'Error: ' + error.message;
                msgEl.style.color = 'red';
            } else {
                msgEl.textContent = 'Password updated! You can now log in.';
                msgEl.style.color = 'green';
            }
        });
    </script>
</body>
</html>
